<script>
let filterData = { parentCategories: [], categories: {}, totalCount: 0 };

/* ═══════════════ Subcategory background images ═══════════════ */
const subcatImages = {
  'Арматура': '/images/products/steel_rebar_premium.png',
  'Балка двутавровая': '/images/products/steel_beams_premium_1778423982429.png',
  'Швеллер': '/images/products/steel_channels_premium_1778424020131.png',
  'Трубы профильные': '/images/products/profile_tubes_premium_1778423900429.png',
  'Трубы круглые': '/images/truba_kruglaya_real.jpg',
  'Трубы водогазопроводные': '/images/products/vgp_pipes_premium_1778423885236.png',
  'Лист горячекатаный': '/images/products/hot_rolled_sheets_premium_1778423920658.png',
  'Лист холоднокатаный': '/images/products/cold_rolled_sheets_premium_1778423951350.png',
  'Лист оцинкованный': '/images/products/checker_plate_premium_1778423936809.png',
  'Круг': '/images/products/round_steel_premium_1778423868660.png',
  'Полоса': '/images/products/cold_rolled_sheets_premium_1778423951350.png',
  'Квадрат': '/images/products/square_steel_premium_1778423850615.png',
  'Шестигранник': '/images/products/round_steel_premium_1778423868660.png',
  'Уголок': '/images/products/steel_angles_premium_1778423996872.png',
  'Сетка сварная': '/images/products/steel_mesh_premium_1778423969480.png',
  'Сетка стальная': '/images/products/steel_mesh_premium_1778423969480.png',
  'Проволока': '/images/products/steel_wire_premium_1778423804026.png',
  'Катанка': '/images/products/wire_rod_premium_1778423828914.png',
  'Профнастил': '/images/products/corrugated_sheets_premium.png',
  'Металлочерепица': '/images/products/corrugated_sheets_premium.png',
  'Водосток': '/images/warehouse_ready.jpg',
  'Сайдинг': '/images/warehouse_ready.jpg',
  'Лист нержавеющий': '/images/stainless_steel_product.png',
  'Труба нержавеющая': '/images/stainless_steel_product.png',
  'Круг нержавеющий': '/images/stainless_steel_product.png',
  'default': '/images/warehouse_ready.jpg'
};

function getSubcatImage(name) {
  if (subcatImages[name]) return subcatImages[name];
  const lower = name.toLowerCase();
  if (lower.includes('арматур'))    return '/images/products/steel_rebar_premium.png';
  if (lower.includes('балк'))       return '/images/products/steel_beams_premium_1778423982429.png';
  if (lower.includes('швеллер'))    return '/images/products/steel_channels_premium_1778424020131.png';
  if (lower.includes('труб проф')) return '/images/products/profile_tubes_premium_1778423900429.png';
  if (lower.includes('труб кру'))  return '/images/truba_kruglaya_real.jpg';
  if (lower.includes('вгп') || lower.includes('водогаз')) return '/images/products/vgp_pipes_premium_1778423885236.png';
  if (lower.includes('труб'))       return '/images/products/profile_tubes_premium_1778423900429.png';
  if (lower.includes('горяч'))      return '/images/products/hot_rolled_sheets_premium_1778423920658.png';
  if (lower.includes('холодн'))     return '/images/products/cold_rolled_sheets_premium_1778423951350.png';
  if (lower.includes('оцинк'))      return '/images/products/checker_plate_premium_1778423936809.png';
  if (lower.includes('лист'))       return '/images/products/hot_rolled_sheets_premium_1778423920658.png';
  if (lower.includes('квадрат'))    return '/images/products/square_steel_premium_1778423850615.png';
  if (lower.includes('шестигран'))  return '/images/products/round_steel_premium_1778423868660.png';
  if (lower.includes('круг'))       return '/images/products/round_steel_premium_1778423868660.png';
  if (lower.includes('полос'))      return '/images/products/cold_rolled_sheets_premium_1778423951350.png';
  if (lower.includes('угол'))       return '/images/products/steel_angles_premium_1778423996872.png';
  if (lower.includes('сетк'))       return '/images/products/steel_mesh_premium_1778423969480.png';
  if (lower.includes('проволок'))   return '/images/products/steel_wire_premium_1778423804026.png';
  if (lower.includes('катан'))      return '/images/products/wire_rod_premium_1778423828914.png';
  if (lower.includes('профнас'))    return '/images/products/corrugated_sheets_premium.png';
  if (lower.includes('металлочер')) return '/images/products/corrugated_sheets_premium.png';
  if (lower.includes('нерж'))       return '/images/stainless_steel_product.png';
  if (lower.includes('водосток'))   return '/images/warehouse_ready.jpg';
  if (lower.includes('сайдинг'))    return '/images/warehouse_ready.jpg';
  return '/images/warehouse_ready.jpg';
}

/* ═══════════════ Tab Icons ═══════════════ */
const tabIcons = {
  'Популярные категории': 'star',
  'Чёрный металлопрокат': 'construction',
  'Нержавеющая сталь': 'shield',
  'Специальные стали': 'workspace_premium',
  'Кровельные материалы': 'roofing'
};

const TAB_ORDER = [
  'Популярные категории',
  'Чёрный металлопрокат',
  'Нержавеющая сталь',
  'Специальные стали',
  'Кровельные материалы'
];

async function initSelectPage() {
  try {
    const res = await fetch('/api/filters');
    filterData = await res.json();
    
    // Add "Популярные категории" to parentCategories
    if (filterData.parentCategories && !filterData.parentCategories.includes('Популярные категории')) {
      filterData.parentCategories.unshift('Популярные категории');
    }
    
    // Define popular subcategories
    const popularSubCats = [
      { name: 'Арматура' },
      { name: 'Балка двутавровая' },
      { name: 'Швеллер' },
      { name: 'Трубы профильные' },
      { name: 'Уголок' },
      { name: 'Лист горячекатаный' },
      { name: 'Профнастил' }
    ];
    
    // Populate counts and resolve categories
    filterData.categories['Популярные категории'] = popularSubCats.map(pCat => {
      let count = 0;
      for (const [pKey, subList] of Object.entries(filterData.categories)) {
        if (pKey === 'Популярные категории') continue;
        const found = subList.find(c => c.name === pCat.name);
        if (found) {
          count = found.count;
          break;
        }
      }
      return { name: pCat.name, count };
    }).filter(c => c.count > 0);

    document.getElementById('loadingState').classList.add('hidden');
    renderTabs();
    
    // Auto-select first tab
    const sorted = getSortedCategories();
    const firstTab = sorted[0];
    if (firstTab) selectTab(firstTab);
  } catch (e) {
    console.error('Failed to load filters', e);
    document.getElementById('loadingState').innerHTML = `
      <span class="material-symbols-outlined text-4xl text-error mb-4">error</span>
      <p class="text-error text-sm font-semibold">Ошибка загрузки категорий</p>
      <button onclick="initSelectPage()" class="mt-4 px-6 py-2 bg-primary text-on-primary font-label-caps text-label-caps tracking-widest transition-all">Повторить</button>
    `;
  }
}

function getSortedCategories() {
  const sorted = [];
  TAB_ORDER.forEach(name => {
    if (filterData.parentCategories.includes(name)) sorted.push(name);
  });
  filterData.parentCategories.forEach(name => {
    if (!sorted.includes(name)) sorted.push(name);
  });
  return sorted;
}

function renderTabs() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = '';
  const sorted = getSortedCategories();
  sorted.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab';
    btn.dataset.category = p;
    const icon = tabIcons[p] || 'inventory_2';
    btn.innerHTML = `<span class="material-symbols-outlined tab-icon">${icon}</span><span>${p}</span>`;
    btn.onclick = () => selectTab(p);
    container.appendChild(btn);
  });
}

let activeParentCat = '';

function selectTab(parentCat) {
  activeParentCat = parentCat;
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.category === parentCat);
  });
  
  // Update section title
  const activeTitle = document.getElementById('activeCategoryTitle');
  if (activeTitle) {
    activeTitle.textContent = parentCat;
  }
  
  renderSubCategories(parentCat);
}

function renderSubCategories(parentCat) {
  const container = document.getElementById('subCategoryContainer');
  let cats = filterData.categories[parentCat] || [];
  container.innerHTML = '';
  
  // Ensure no slider classes remain
  container.classList.remove('is-popular-slider');

  if (parentCat === 'Популярные категории') {
    cats = JSON.parse(JSON.stringify(cats));
    cats.forEach(cat => {
      let maxCount = cat.count;
      for (const [pCat, subCats] of Object.entries(filterData.categories)) {
        if (pCat === 'Популярные категории') continue;
        const found = subCats.find(c => c.name === cat.name);
        if (found && found.count > maxCount) {
          maxCount = found.count;
        }
      }
      cat.count = maxCount;
    });
  }

  if (cats.length === 0) {
    container.innerHTML = `
      <div class="col-span-full text-center py-20 text-on-surface-variant opacity-50">
        <span class="material-symbols-outlined text-5xl mb-3 block">category</span>
        <p class="font-label-caps text-label-caps tracking-widest">НЕТ ПОДРАЗДЕЛОВ</p>
      </div>
    `;
    return;
  }

  // Определяем динамическую высоту карточек в зависимости от их количества
  let cardHeightStyle = '';
  if (cats.length <= 2) {
    // 1-2 карточки: делаем их высокими и премиальными
    cardHeightStyle = 'min-height: 250px; height: max(300px, 45vh);';
  } else if (cats.length <= 4) {
    // 3-4 карточки: средняя высота
    cardHeightStyle = 'min-height: 200px; height: max(220px, 30vh);';
  } else {
    // 5 и более карточек: вычисляем высоту
    cardHeightStyle = 'min-height: 160px; height: max(160px, calc(50vh - 180px)); max-height: 320px;';
  }

  cats.forEach((cat, i) => {
    const imageUrl = getSubcatImage(cat.name);
    const numberStr = String(i + 1).padStart(2, '0');
    
    const card = document.createElement('a');
    card.className = `group relative overflow-hidden border border-outline-variant/20 bg-surface block no-underline text-inherit cursor-pointer fade-up subcat-flex-card`;
    card.style.cssText = `animation-delay: ${i * 0.05}s; ${cardHeightStyle}`;
    
    card.innerHTML = `
      <img class="cat-card-img absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" style="opacity:0.55" src="${imageUrl}" alt="${cat.name}"/>
      <div class="cat-card-overlay"></div>
      <div class="absolute bottom-0 left-0 p-5 md:p-6 w-full z-10">
        <span class="font-label-caps text-label-caps text-primary mb-2 block tracking-widest">${numberStr} //</span>
        <h3 class="cat-card-title text-[17px] md:text-[22px] lg:text-[24px] font-headline-md uppercase leading-tight pr-2">${cat.name}</h3>
        <p class="cat-card-desc font-label-caps text-label-caps opacity-100 md:opacity-0 md:translate-y-4 transition-all duration-500 md:group-hover:opacity-100 md:group-hover:translate-y-0 tracking-wider mt-2">
          ${cat.count} ТОВАРОВ
        </p>
      </div>
    `;
    
    card.onclick = (e) => {
      e.preventDefault();
      let finalParentCat = parentCat;
      if (parentCat === 'Популярные категории') {
        for (const [pCat, subCats] of Object.entries(filterData.categories)) {
          if (pCat === 'Популярные категории') continue;
          if (subCats.some(c => c.name === cat.name)) {
            finalParentCat = pCat;
            break;
          }
        }
      }
      const pcat = encodeURIComponent(finalParentCat);
      const c = encodeURIComponent(cat.name);
      window.location.href = `/catalog?pcat=${pcat}&cat=${c}`;
    };
    container.appendChild(card);
  });
}

function switchTabByArrow(direction) {
  const sorted = getSortedCategories();
  if (sorted.length === 0) return;
  let currentIndex = sorted.indexOf(activeParentCat);
  if (currentIndex === -1) currentIndex = 0;
  
  let nextIndex = currentIndex + direction;
  if (nextIndex < 0) {
    nextIndex = sorted.length - 1;
  } else if (nextIndex >= sorted.length) {
    nextIndex = 0;
  }
  
  const nextTabName = sorted[nextIndex];
  selectTab(nextTabName);
  
  // Smoothly scroll the active tab into view in the tabs container
  const container = document.getElementById('categoryTabs');
  if (container) {
    const activeBtn = container.querySelector(`[data-category="${nextTabName}"]`);
    if (activeBtn) {
      activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  }
}

document.addEventListener('DOMContentLoaded', initSelectPage);
</script>

</body>
</html>
