server {
    listen 80;
    server_name zhelezniydrovosek.ru www.zhelezniydrovosek.ru;

    # Redirect all HTTP traffic to HTTPS (will be configured by Certbot, but here is a placeholder)
    # return 301 https://$host$request_uri;

    # Root directory of the app for static assets or fallback (if serving statics via Nginx instead of Express)
    root /var/www/woodman;

    # Logging
    access_log /var/log/nginx/steelwoodman_access.log;
    error_log /var/log/nginx/steelwoodman_error.log;

    location / {
        # Forward requests to Express server running via PM2 on port 3000
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom error page for 502/503/504 (when backend is down/restarting)
    error_page 502 503 504 /502.html;
    location = /502.html {
        root /var/www/woodman;
        internal;
    }
}
