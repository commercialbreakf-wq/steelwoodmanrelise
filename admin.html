<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
    })();
  </script>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg?v=4">
<link rel="apple-touch-icon" href="/images/favicon.svg?v=4">
<link rel="mask-icon" href="/images/favicon.svg?v=4" color="#ffb0cc">

    <title>Панель управления | Железный Дровосек</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Supabase JS for Realtime chat -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body { background: #0f0e0c; color: #e7e2dd; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 176, 204, 0.3); border-radius: 4px; }
        
        /* Glass effect for later use */
        .glass { background: rgba(33, 31, 29, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(83, 67, 71, 0.2); }
        
        .nav-item.active { background: rgba(255, 255, 255, 0.05); color: #ffb0cc; }
    </style>
</head>
<body class="min-h-screen">
    <div id="admin-app">
        <!-- The app shell will be injected here by js/admin/app.js -->
        <div class="flex items-center justify-center h-screen bg-[#0f0e0c] text-[#ffb0cc]">
            <div class="flex flex-col items-center gap-4">
                <div class="w-12 h-12 border-4 border-[#ffb0cc]/20 border-t-[#ffb0cc] rounded-full animate-spin"></div>
                <div class="animate-pulse font-['Space Grotesk'] text-sm uppercase tracking-widest">Загрузка панели управления...</div>
            </div>
        </div>
    </div>

    <!-- Shared UI & Global Chat Drawer -->
    <script src="/js/shared-ui.js?v=8" defer></script>
    <!-- Application Entry Point -->
    <script type="module" src="/js/admin/app.js"></script>
</body>
</html>
