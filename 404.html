<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
    })();
  </script>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg?v=4">
<link rel="apple-touch-icon" href="/images/favicon.svg?v=4">
<link rel="mask-icon" href="/images/favicon.svg?v=4" color="#ffb0cc">

    <title>404 — Страница не найдена | ЖЕЛЕЗНЫЙ ДРОВОСЕК</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="/js/shared-ui.js?v=8" defer></script>
    <script src="/js/theme.js?v=1"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glitch-text {
            position: relative;
            animation: glitch 2s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        .bg-industrial {
            background-image: linear-gradient(rgba(21, 19, 17, 0.8), rgba(21, 19, 17, 0.8)), url('/industrial_404_bg_1778612131862.png');
            background-size: cover;
            background-position: center;
        }
        .pink-slide {
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        .pink-slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #ffb0cc;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }
        .pink-slide:hover::after {
            transform: translateX(100%);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-x-hidden">
    <!-- Header is injected by shared-ui.js -->

    <main class="relative min-h-screen flex items-center justify-center pt-20 bg-industrial">
        <div class="px-margin-edge-mobile md:px-margin-edge w-full max-w-container-max mx-auto text-center relative z-10">
            <div class="space-y-8">
                <div class="relative inline-block">
                    <h1 class="text-[120px] md:text-[240px] font-display-xl leading-none opacity-10 select-none">404</h1>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="font-label-caps text-primary tracking-[0.4em] uppercase text-sm md:text-lg glitch-text">Ошибка доступа к объекту</span>
                    </div>
                </div>
                
                <div class="max-w-2xl mx-auto space-y-6">
                    <h2 class="text-4xl md:text-6xl font-display-xl uppercase leading-tight">МЕТАЛЛ <span class="text-primary">НЕ ОБНАРУЖЕН</span></h2>
                    <p class="text-on-surface-variant font-body-lg text-lg md:text-xl opacity-80">
                        Похоже, запрашиваемая страница была перемещена в архив или никогда не существовала в нашей базе данных.
                    </p>
                </div>

                <div class="flex flex-col sm:flex-row items-center justify-center gap-6 pt-12">
                    <a href="/hi_tech_style/code.html" class="pink-slide px-12 py-5 bg-transparent border border-primary text-primary font-label-caps text-sm tracking-[0.2em] uppercase hover:text-surface transition-colors duration-500 no-underline">
                        ВЕРНУТЬСЯ НА ГЛАВНУЮ
                    </a>
                    <a href="javascript:history.back()" class="px-12 py-5 bg-surface-container border border-outline-variant/30 text-on-surface font-label-caps text-sm tracking-[0.2em] uppercase hover:border-primary transition-colors no-underline">
                        НАЗАД
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Decorative industrial elements -->
        <div class="absolute bottom-0 right-0 w-full h-1/2 bg-gradient-to-t from-background to-transparent pointer-events-none"></div>
    </main>

    <footer id="globalFooter"></footer>

    <script>
        // Shared UI scripts might need manual triggers if they don't auto-run perfectly
        document.addEventListener('DOMContentLoaded', () => {
            if (window.updateGlobalCartBadge) window.updateGlobalCartBadge();
        });
    </script>
</body>
</html>
